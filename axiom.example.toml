# ─── Axiom Configuration (example) ───────────────────────────────────────────

log_level = "info"

[database]
path       = "axiom_memory.db"
encrypted  = false
passphrase = ""
vec_dim    = 768

[model]
model_path       = ""
context_size     = 32768
quantization     = "q4_k_m"
gpu_layers       = 0
threads          = 4
temperature      = 0.4
top_p            = 0.9
runner_type      = "ollama"
runner_url       = "http://localhost:11434"
runner_model     = "qwen2.5-coder:32b"
runner_timeout   = 300
enable_streaming = true
default_mode     = "local"
max_iterations   = 60

[embedding]
enabled  = true
provider = "ollama"
model    = "nomic-embed-text"
url      = "http://localhost:11434"
dim      = 768

[cloud]
anthropic_key   = ""
anthropic_model = "claude-sonnet-4-5-20250929"
gemini_key      = ""
gemini_model    = "gemini-2.0-flash"
max_tokens      = 8192
timeout_sec     = 300

[tools]
mojo_path        = ""
mojo_kernels_dir = "mojo/kernels"
python_path      = ".venv/bin/python"
wolfram_app_id   = ""
allowed_dirs = ["/home/shki/projects", "/home/shki/Documents", "/home/shki/Desktop"]
max_exec_time_sec = 300
max_file_size     = 10485760

[security]
enable_guardrails = true
blocked_commands  = ["rm -rf /", "sudo", "mkfs", "dd if="]
allow_network     = true

[security.sandbox]
enabled = true
allowed_dirs    = ["/home/shki/projects", "/home/shki/Documents", "/home/shki/Desktop"]
blocked_patterns = ["rm -rf", "sudo"]
allowed_binaries = [
    "python3", "python", "pip", "pip3",
    "node", "npm", "npx", "yarn", "bun",
    "go", "cargo", "rustc",
    "gcc", "g++", "make", "cmake",
    "mojo", "ls", "cat", "grep", "head", "tail", "wc", "echo", "mkdir", "git",
]
timeout_sec      = 60
max_output_bytes = 65536

[reflection]
enabled = true
