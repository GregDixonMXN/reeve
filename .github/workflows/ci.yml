name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # The repository currently contains a historical multi-gigabyte model.
      # Use a blobless sparse checkout so CI remains usable until that artifact
      # is removed from the repository and its history.
      - name: Check out source without model artifacts
        env:
          AXIOM_GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/*' '!/models/'
          authorization="$(printf 'x-access-token:%s' "${AXIOM_GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c protocol.version=2 \
            -c "http.extraheader=AUTHORIZATION: basic ${authorization}" \
            fetch --no-tags --depth=1 --filter=blob:none origin "${GITHUB_REF}"
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test ! -e models/phi-4-Q4_K_M.gguf

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Verify frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend run build
          npm --prefix frontend audit --audit-level=high

      - name: Verify Python security tests
        run: python scripts/test_web_scrape.py

      - name: Verify Go modules
        run: go mod verify

      - name: Vet Go source
        run: go vet -tags webkit2_41 ./...

      - name: Run Go race tests
        run: go test -race -tags webkit2_41 ./...
