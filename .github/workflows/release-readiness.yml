name: Release readiness (no publish)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate Linux package
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # This workflow intentionally builds but never uploads or publishes an
      # artifact. Release publication stays disabled until repository-history
      # model and credential findings have been remediated.
      - name: Check out source without model artifacts
        env:
          AXIOM_GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/*' '!/models/'
          authorization="$(printf 'x-access-token:%s' "${AXIOM_GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c protocol.version=2 \
            -c "http.extraheader=AUTHORIZATION: basic ${authorization}" \
            fetch --no-tags --depth=1 --filter=blob:none origin "${GITHUB_REF}"
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test ! -e models/phi-4-Q4_K_M.gguf

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Run release verification
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend run build
          npm --prefix frontend audit --audit-level=high
          python scripts/test_web_scrape.py
          go mod verify
          go vet -tags webkit2_41 ./...
          go test -race -tags webkit2_41 ./...

      - name: Build production binary
        run: '"$(go env GOPATH)/bin/wails" build -clean -tags webkit2_41'

      - name: Inspect build without publishing
        run: |
          test -x build/bin/axiom
          file build/bin/axiom
          sha256sum build/bin/axiom
          {
            echo "### Release readiness only"
            echo
            echo "The Linux binary built successfully. No artifact was uploaded or published."
            echo "Publishing remains disabled until the repository-history blockers are cleared."
          } >> "${GITHUB_STEP_SUMMARY}"
