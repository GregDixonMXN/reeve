# ─── Axiom Configuration ─────────────────────────────────────────────────────

log_level = "debug"  # debug | info | warn | error

[database]
path       = "axiom_memory.db"
encrypted  = false
passphrase = ""
vec_dim    = 768

[model]
model_path     = ""                          # Not needed when using Ollama
context_size   = 32768                       # Large context for complex tasks; DeepSeek/Qwen both support this
quantization   = "q4_k_m"
gpu_layers     = 0
threads        = 4
temperature    = 0.6                         # Lower slightly for DeepSeek coding tasks
top_p          = 0.9
runner_type    = "ollama"                    # "ollama" | "openai"
runner_url     = "http://localhost:11434"    # Ollama default port
runner_model   = "qwen2.5-coder:32b"           # The new Qwen-based sovereign brain
runner_timeout = 300                         # CRITICAL: Increase timeout to 5 minutes
enable_streaming = true

default_mode = "local"
max_iterations = 9999           # 0 = mode defaults (25 local / 50 cloud); 9999 = effectively uncapped

[embedding]
enabled  = true
provider = "ollama"                           # "ollama" (Phase 3) | "mojo" (Phase 4)
model    = "nomic-embed-text"                 # pull with: ollama pull nomic-embed-text
url      = "http://localhost:11434"
dim      = 768                                # nomic-embed-text = 768, all-minilm = 384

[cloud]
anthropic_key   = "***REMOVED***"                          # https://console.anthropic.com
anthropic_model = "claude-sonnet-4-6"
gemini_key      = "AIzaSyD6BMNVXaa_R4QmLBO_OwlvDTlHA3YY0Dk"                          # https://aistudio.google.com
gemini_model    = "gemini-3-pro"
max_tokens      = 16000
timeout_sec     = 600

[tools]
mojo_path        = ""
mojo_kernels_dir = "mojo/kernels"
python_path      = ".venv/bin/python"
wolfram_app_id   = "T3AJVUWUWU"                       # https://developer.wolframalpha.com
allowed_dirs = ["/home/shki/projects", "/home/shki/Documents", "/home/shki/Desktop"]
max_exec_time_sec = 600
max_file_size     = 10485760                # 10MB

[security]
enable_guardrails = true
blocked_commands  = ["rm -rf /", "sudo", "mkfs", "dd if="]
allow_network     = true                   # Set true to enable Wolfram|Alpha


[security.sandbox]
enabled = true
allowed_dirs    = ["/home/shki/projects", "/home/shki/Documents", "/home/shki/Desktop"]
blocked_patterns = ["rm -rf", "sudo"]
allowed_binaries = [
    "python3", "python", "pip", "pip3",
    "node", "npm", "npx", "yarn", "bun",
    "go", "cargo", "rustc",
    "gcc", "g++", "make", "cmake",
    "mojo", "ls", "cat", "grep", "head", "tail", "wc", "echo", "mkdir", "git",
]
timeout_sec     = 30
max_output_bytes = 65536
